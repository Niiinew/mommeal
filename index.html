<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Mommeal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Elements */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .floating-shape:nth-child(1) {
            top: 10%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            top: 70%;
            left: 80%;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            animation-delay: 2s;
        }

        .floating-shape:nth-child(3) {
            top: 20%;
            right: 10%;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            animation-delay: 4s;
        }

        .floating-shape:nth-child(4) {
            bottom: 20%;
            left: 20%;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-container {
            text-align: center;
        }

        .login-form {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            animation: slideUp 0.8s ease-out;
        }

        .login-form:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 35px 80px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.3);
        }

        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(50px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .login-form h2 {
            color: #ff6b6b;
            margin-bottom: 40px;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid rgba(255, 107, 107, 0.2);
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 
                0 0 0 4px rgba(255, 107, 107, 0.1),
                0 10px 30px rgba(255, 107, 107, 0.2);
            transform: translateY(-2px);
            background: white;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e, #ffaaa8);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.4);
            background: linear-gradient(135deg, #ff5252, #ff7b7b, #ff9999);
        }

        .login-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .demo-text {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
            background: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ff6b6b;
        }

        /* Loading Animation */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #ff6b6b;
            font-size: 18px;
            font-weight: 600;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 20px 25px;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            z-index: 10000;
            transform: translateX(400px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(135deg, #28a745, #34ce57);
        }

        .notification.error {
            background: linear-gradient(135deg, #dc3545, #e74c3c);
        }

        .notification.info {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                max-width: 350px;
                padding: 15px;
            }

            .login-form {
                padding: 30px 25px;
            }

            .login-form h2 {
                font-size: 28px;
            }

            .logo {
                font-size: 40px;
            }
        }

        @media (max-width: 480px) {
            .container {
                max-width: 300px;
            }

            .login-form {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .notification {
                top: 20px;
                right: 20px;
                left: 20px;
                max-width: none;
            }
        }

        /* Input Icons */
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff6b6b;
            font-size: 18px;
            pointer-events: none;
            opacity: 0.7;
        }

        .form-group {
            position: relative;
        }

        /* Enhanced Hover Effects */
        .login-form {
            position: relative;
            overflow: hidden;
        }

        .login-form::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .login-form:hover::before {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">กำลังเข้าสู่ระบบ...</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="login-container">
            <div class="login-form">
                <div class="logo">🍼</div>
                <h2>เข้าสู่ระบบ Mommeal</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">ชื่อผู้ใช้:</label>
                        <input type="text" id="username" name="username" required 
                               placeholder="กรุณาใส่ชื่อผู้ใช้">
                        <span class="input-icon">👤</span>
                    </div>
                    <div class="form-group">
                        <label for="password">รหัสผ่าน:</label>
                        <input type="password" id="password" name="password" required 
                               placeholder="กรุณาใส่รหัสผ่าน">
                        <span class="input-icon">🔒</span>
                    </div>
                    <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
                </form>
                <p class="demo-text">
                    💡 <strong>Demo:</strong> ใส่ชื่อผู้ใช้และรหัสผ่านอะไรก็ได้เพื่อทดสอบระบบ
                </p>
            </div>
        </div>
    </div>

    <script>
        // Show notification function
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 100);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 400);
            }, 3000);
        }

        // Show loading function
        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }

        // Hide loading function
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Login form handling
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (username && password) {
                showLoading();
                
                // Simulate login process
                setTimeout(() => {
                    // Store user data
                    localStorage.setItem('currentUser', username);
                    localStorage.setItem('loginTime', new Date().toISOString());
                    
                    hideLoading();
                    showNotification(`ยินดีต้อนรับ ${username}! 🎉`, 'success');
                    
                    // Redirect to home page
                    setTimeout(() => {
                        // เปลี่ยนเป็น URL ของหน้าแรกที่คุณต้องการ
                        window.location.href = 'home.html';
                        // หรือถ้าใช้ single page application
                        // showPage('home');
                    }, 1500);
                }, 2000);
            } else {
                showNotification('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'error');
            }
        });

        // Check if already logged in
        if (localStorage.getItem('currentUser')) {
            showNotification('คุณเข้าสู่ระบบแล้ว กำลังนำทางไปหน้าแรก...', 'info');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 2000);
        }

        // Add enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // Add input focus effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Add some interactive effects
        document.addEventListener('mousemove', function(e) {
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const loginForm = document.querySelector('.login-form');
            
            const rect = loginForm.getBoundingClientRect();
            const x = mouseX - rect.left - rect.width / 2;
            const y = mouseY - rect.top - rect.height / 2;
            
            const rotateX = y / rect.height * 10;
            const rotateY = x / rect.width * -10;
            
            if (mouseX >= rect.left && mouseX <= rect.right && 
                mouseY >= rect.top && mouseY <= rect.bottom) {
                loginForm.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
            } else {
                loginForm.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
            }
        });

        console.log('🍼 Mommeal Login - Ready!');
        console.log('💡 สำหรับ Demo: ใส่ชื่อผู้ใช้และรหัสผ่านอะไรก็ได้');
    </script>
</body>
</html>
